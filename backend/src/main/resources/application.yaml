spring:
  application:
    name: ttf

ttf:
  frontend-base-url: ${TTF_FRONTEND_BASE_URL:http://localhost:5173}
  cookie:
    secure: ${TTF_COOKIE_SECURE:true}
  cors:
    allowed-origins: ${TTF_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  lifecycle:
    active-room-ttl: ${TTF_ACTIVE_ROOM_TTL:PT6H}
    terminal-grace-period: ${TTF_TERMINAL_GRACE_PERIOD:PT5M}
  rate-limit:
    host-commands-per-second: ${TTF_HOST_COMMANDS_PER_SECOND:5}
